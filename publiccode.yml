  en:
    genericName: "Cloud Document Management"
    shortDescription: "Open-source document and file service with tamper-proof storage, full-text and semantic search and AI-powered document processing for public administrations."
    longDescription: >
      OpenCloud is the core component of the OpenCore stack (OpenCloud +
      OpenCosmos): an open-source document and file service for
      municipalities and public authorities. It replaces the classic DMS
      with a tamper-proof, protected central data location that scales
      digital processes vertically and horizontally.

      The server provides files via WebDAV, a web client and a CS3 API. The
      Reva storage backend supports immutability rules, file-plan metadata
      and scanner integration. AI services complement the core: open_taki
      (LLM-based document analysis, OCR, transcription), semantic search via
      vector storage and LLM routing through microllm.

      The edition is continuously developed as a practice-driven project in
      close cooperation with the municipalities that run it.
    features:
      - "Tamper-proof immutable file storage"
      - "Full-text and semantic search with AI metadata"
      - "WebDAV, web client, mobile apps, office integration (Collabora)"
      - "AI document processing: OCR, summarization, classification, transcription"
      - "Scalable operation on own infrastructure (Podman/nuhost6)"
      - "Scanner, e-mail inbox and document workflow integration"
