description:
  de:
    genericName: "Cloud-Dokumentenmanagement"
    shortDescription: "Open-Source-Dokumenten- und Dateidienst mit revisionssicherem Speicher, Volltext- und Semantiksuche sowie KI-gestützter Dokumentenverarbeitung für die öffentliche Verwaltung."
    longDescription: >
      OpenCloud ist die Kernkomponente des OpenCore-Stacks (OpenCloud +
      OpenCosmos): ein quelloffener Dokumenten- und Dateidienst für
      Behörden und Kommunen. Er ersetzt das klassische DMS durch einen
      revisionssicheren, geschützten zentralen Datenort, der digitalisierte
      Prozesse vertikal und horizontal skaliert.

      Der Server (OpenCloud) stellt Dateien über WebDAV, einen Web-Client und
      eine CS3-API bereit. Das Storage-Backend Reva ermöglicht
      Unveränderlichkeits-Regeln (Immutable Spaces), Aktenzeichen-Metadaten
      und Anbindung an Scanserver. Ergänzend laufen KI-Dienste: open_taki
      (LLM-basierte Dokumentenanalyse, OCR, Transkription), Semantiksuche
      über Vektorspeicher und Routing über microllm.

      Die Edition wird als praxisgeführtes Vortriebsprojekt in enger
      Zusammenarbeit mit den Kommunen, die sie betreiben, fortlaufend
      weiterentwickelt.
    features:
      - "Revisionssicherer, unveränderbarer Dateispeicher (Immutable Spaces)"
      - "Volltext- und Semantiksuche mit KI-Metadaten"
      - "WebDAV, Web-Client, Mobile Apps, Office-Integration (Collabora)"
      - "KI-Dokumentenverarbeitung: OCR, Zusammenfassung, Klassifikation, Transkription"
      - "Skalierbarer Betrieb auf eigener Infrastruktur (Podman/nuhost6)"
      - "Integration von Scanner, E-Mail-Posteingang und Dokumentenworkflows"
    screenshots:
